name: LongExposure
options:
  deploymentTarget:
    iOS: '17.0'
targets:
  LongExposure:
    type: application
    platform: iOS
    sources: [LongExposure]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.kakikukeko.main
        SWIFT_VERSION: '5.0'
        TARGETED_DEVICE_FAMILY: '1'
        MARKETING_VERSION: '1.1'
        CURRENT_PROJECT_VERSION: '2026110802'
        GENERATE_INFOPLIST_FILE: NO
    info:
      path: LongExposure/Info.plist
      properties:
        CFBundleDisplayName: 長時間露光
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        NSCameraUsageDescription: 長時間露光写真の撮影にカメラを使います。
        NSPhotoLibraryAddUsageDescription: 撮影した写真を写真ライブラリへ保存します。
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
